rri-restaurant-profit-hero-v2.webp\" alt=\"\" width=\"1800\" height=\"1200\" fetchpriority=\"high\">\n  \u003C/div>\n  \u003Cdiv class=\"hero-copy\">\n    \u003Ch1 class=\"h1\">More revenue.\u003Cbr>Better margins.\u003C/h1>\n    \u003Cp class=\"lede\">Kutlerri turns the signals across your restaurants into measured profit, then carries the work through.\u003C/p>\n    \u003Cdiv class=\"hero-cta\">\n      \u003Ca href=\"contact.html\" class=\"btn btn-primary\">Find my opportunities \u003Cspan class=\"btn-orb\" aria-hidden=\"true\">&rarr;\u003C/span>\u003C/a>\n      \u003Ca href=\"#how\" class=\"btn btn-ghost\">See how it works\u003C/a>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection class=\"system-strip\" aria-label=\"Connects with the systems already running your restaurants\">\n  \u003Cdiv class=\"system-marquee\">\n    \u003Cdiv class=\"system-track\">\n      \u003Cspan>POS\u003C/span>\u003Cspan>DoorDash\u003C/span>\u003Cspan>Uber Eats\u003C/span>\u003Cspan>Labor\u003C/span>\u003Cspan>Inventory\u003C/span>\u003Cspan>Reviews\u003C/span>\u003Cspan>Accounting\u003C/span>\u003Cspan>Catering\u003C/span>\u003Cspan>Guest data\u003C/span>\n      \u003Cspan aria-hidden=\"true\">POS\u003C/span>\u003Cspan aria-hidden=\"true\">DoorDash\u003C/span>\u003Cspan aria-hidden=\"true\">Uber Eats\u003C/span>\u003Cspan aria-hidden=\"true\">Labor\u003C/span>\u003Cspan aria-hidden=\"true\">Inventory\u003C/span>\u003Cspan aria-hidden=\"true\">Reviews\u003C/span>\u003Cspan aria-hidden=\"true\">Accounting\u003C/span>\u003Cspan aria-hidden=\"true\">Catering\u003C/span>\u003Cspan aria-hidden=\"true\">Guest data\u003C/span>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection class=\"sec thesis-section\" id=\"how\">\n  \u003Cdiv class=\"wrap thesis\" data-reveal>\n    \u003Cdiv class=\"thesis-copy\">\n      \u003Cp class=\"statement\">Nine systems.\u003Cbr>One decision worth making.\u003C/p>\n      \u003Cp class=\"body\">Kutlerri finds the signal that can move your P&amp;L, tells you what it is worth, and runs the work behind it.\u003C/p>\n    \u003C/div>\n\n    \u003Cdiv class=\"signal-field\" aria-hidden=\"true\">\n      \u003Csvg class=\"signal-lines\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\">\n        \u003Cpath d=\"M50 8 L50 50\"/>\u003Cpath d=\"M79 19 L50 50\"/>\u003Cpath d=\"M89 44 L50 50\"/>\n        \u003Cpath d=\"M81 75 L50 50\"/>\u003Cpath d=\"M53 91 L50 50\"/>\u003Cpath d=\"M19 77 L50 50\"/>\n        \u003Cpath d=\"M9 51 L50 50\"/>\u003Cpath d=\"M16 21 L50 50\"/>\u003Cpath d=\"M49 73 L50 50\"/>\n      \u003C/svg>\n      \u003Cspan class=\"signal-glow\">\u003C/span>\n      \u003Cdiv class=\"decision-core\">\u003Cstrong>$\u003C/strong>\u003Cspan>profit decision\u003C/span>\u003C/div>\n      \u003Cspan class=\"signal-node signal-money\">POS \u003Cstrong>+$42K?\u003C/strong>\u003C/span>\n      \u003Cspan class=\"signal-node signal-money\">Delivery \u003Cstrong>$7.4K?\u003C/strong>\u003C/span>\n      \u003Cspan class=\"signal-node signal-money\">Labor \u003Cstrong>$1.1K/mo?\u003C/strong>\u003C/span>\n      \u003Cspan class=\"signal-node\">Inventory\u003C/span>\n      \u003Cspan class=\"signal-node\">Reviews\u003C/span>\n      \u003Cspan class=\"signal-node\">Accounting\u003C/span>\n      \u003Cspan class=\"signal-node signal-money\">Catering \u003Cstrong>+$186K?\u003C/strong>\u003C/span>\n      \u003Cspan class=\"signal-node\">Guest data\u003C/span>\n      \u003Cspan class=\"signal-node\">Local demand\u003C/span>\n      \u003Cp class=\"signal-caption\">\u003Cspan>\u003C/span>Illustrative opportunity scan\u003C/p>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003Csection class=\"sec outcome-chapter\">\n  \u003Cdiv class=\"wrap\">\n    \u003Cdiv class=\"narrow\" data-reveal>\n      \u003Ch2 class=\"h2\">Work that lands on the P&amp;L.\u003C/h2>\n      \u003Cp class=\"body\">Each agent owns a measurable result, not another dashboard for your team to operate.\u003C/p>\n    \u003C/div>\n\n    \u003Cdiv class=\"outcome-shell\">\n      \u003Cdiv class=\"outcome-grid\">\n        \u003Carticle class=\"outcome-card outcome-lead\" id=\"revenue\">\n          \u003Cimg src=\"public/kutlerri-catering-team.webp\" alt=\"Restaurant team packing a large catering order\" width=\"1400\" height=\"1050\" loading=\"lazy\">\n          \u003Cdiv class=\"outcome-scrim\">\u003C/div>\n          \u003Cdiv class=\"outcome-content\">\n            \u003Cp class=\"outcome-kicker\">Grow revenue\u003C/p>\n            \u003Ch3>Turn nearby offices into repeat catering accounts.\u003C/h3>\n            \u003Cp>Kutlerri maps demand, reaches the buyer, builds the quote and follows through.\u003C/p>\n            \u003Cdiv class=\"outcome-result\">\u003Cstrong class=\"num\">+31%\u003C/strong>\u003Cspan>catering revenue over six months at RASA\u003C/span>\u003C/div>\n            \u003Ca href=\"catering.html\" class=\"outcome-link\">See the Catering Agent \u003Cspan aria-hidden=\"true\">&rarr;\u003C/span>\u003C/a>\n          \u003C/div>\n        \u003C/article>\n\n        \u003Carticle class=\"outcome-card outcome-margin\" id=\"margin\">\n          \u003Cdiv class=\"outcome-content\">\n            \u003Cp class=\"outcome-kicker\">Protect margin\u003C/p>\n            \u003Ch3>Stop paying for sales that lose money.\u003C/h3>\n            \u003Cp>A delivery promo created $3,880 in sales and lost $612 after spend. Kutlerri flags the decision before the next cycle.\u003C/p>\n            \u003Cp class=\"note\">Demo group. Example figures.\u003C/p>\n          \u003C/div>\n          \u003Cdiv class=\"profit-object\" aria-hidden=\"true\">\u003Cspan>\u003C/span>\u003Cspan>\u003C/span>\u003Cspan>\u003C/span>\u003C/div>\n        \u003C/article>\n\n        \u003Carticle class=\"outcome-card outcome-expansion\" id=\"expansion\">\n          \u003Cdiv class=\"outcome-content\">\n            \u003Cp class=\"outcome-kicker\">Expand with evidence\u003C/p>\n            \u003Ch3>Know whether a site can win before you sign.\u003C/h3>\n            \u003Cdiv class=\"site-range\">\n              \u003Cspan class=\"small\">Modeled first-year sales\u003C/span>\n              \u003Cstrong class=\"num\">$1.48M-$1.72M\u003C/strong>\n            \u003C/div>\n            \u003Cp class=\"note\">Modeled from demo data. Not a guarantee.\u003C/p>\n          \u003C/div>\n        \u003C/article>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003C!-- ===================================================================== -->\n\u003C!-- A day. Full-width three-phase timeline. Replaces the rotating prism,    -->\n\u003C!-- which only ever showed one of its three faces and left the column       -->\n\u003C!-- half empty.                                                             -->\n\u003C!-- ===================================================================== -->\n\u003Csection class=\"sec sunk\" id=\"day\">\n  \u003Cdiv class=\"wrap\">\n    \u003Cdiv class=\"narrow\" data-reveal>\n      \u003Ch2 class=\"h2\">The agents work while your restaurants do.\u003C/h2>\n    \u003C/div>\n\n    \u003Cdiv class=\"day\" style=\"margin-top: clamp(28px, 3.5vw, 44px);\">\n      \u003Cdiv class=\"day-phase\">\n        \u003Cdiv>\n          \u003Cp class=\"day-when\">Morning\u003C/p>\n          \u003Cp class=\"h3\" style=\"margin-top: 10px;\">The kitchen gets its plan before the first shift clocks in.\u003C/p>\n        \u003C/div>\n        \u003Cdiv class=\"stack\">\n          \u003Csc-for list=\"{{ morning }}\" as=\"e\" hint-placeholder-count=\"2\">\n            \u003Cdiv class=\"day-event\">\n              \u003Cp class=\"day-at\">{{ e.at }}\u003C/p>\n              \u003Cp style=\"font-size: 15px;\">{{ e.what }}\u003C/p>\n              \u003Cp class=\"tiny\">{{ e.who }}\u003C/p>\n            \u003C/div>\n          \u003C/sc-for>\n        \u003C/div>\n      \u003C/div>\n\n      \u003Cdiv class=\"day-phase\">\n        \u003Cdiv>\n          \u003Cp class=\"day-when\">Midday\u003C/p>\n          \u003Cp class=\"h3\" style=\"margin-top: 10px;\">Buyers get answered while the line is slammed.\u003C/p>\n        \u003C/div>\n        \u003Cdiv class=\"stack\">\n          \u003Csc-for list=\"{{ midday }}\" as=\"e\" hint-placeholder-count=\"2\">\n            \u003Cdiv class=\"day-event\">\n              \u003Cp class=\"day-at\">{{ e.at }}\u003C/p>\n              \u003Cp style=\"font-size: 15px;\">{{ e.what }}\u003C/p>\n              \u003Cp class=\"tiny\">{{ e.who }}\u003C/p>\n            \u003C/div>\n          \u003C/sc-for>\n        \u003C/div>\n      \u003C/div>\n\n      \u003Cdiv class=\"day-phase\">\n        \u003Cdiv>\n          \u003Cp class=\"day-when\">Close\u003C/p>\n          \u003Cp class=\"h3\" style=\"margin-top: 10px;\">You get two decisions, not forty tabs.\u003C/p>\n        \u003C/div>\n        \u003Cdiv class=\"stack\">\n          \u003Csc-for list=\"{{ close }}\" as=\"e\" hint-placeholder-count=\"2\">\n            \u003Cdiv class=\"day-event\">\n              \u003Cp class=\"day-at\">{{ e.at }}\u003C/p>\n              \u003Cp style=\"font-size: 15px;\">{{ e.what }}\u003C/p>\n              \u003Cp class=\"tiny\">{{ e.who }}\u003C/p>\n            \u003C/div>\n          \u003C/sc-for>\n        \u003C/div>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003C!-- ===================================================================== -->\n\u003C!-- Decisions. The product's core loop, running for real on the page, then  -->\n\u003C!-- the boundary that governs it. One interactive moment, one purpose.      -->\n\u003C!-- ===================================================================== -->\n\u003Csection class=\"sec\" id=\"humans\">\n  \u003Cdiv class=\"wrap\">\n    \u003Cdiv class=\"narrow\" data-reveal>\n      \u003Ch2 class=\"h2\">Agents do the work. You keep the decisions.\u003C/h2>\n      \u003Cp class=\"body\" style=\"margin-top: 20px;\">This is the whole loop, and it is running. Walk a real recommendation from the moment an agent finds it to the month it shows up in the P&amp;L.\u003C/p>\n    \u003C/div>\n\n    \u003Cdiv class=\"demo\" style=\"margin-top: clamp(28px, 3.5vw, 44px);\">\n      \u003Cdiv class=\"demo-bar\">\n        \u003Cdiv class=\"demo-steps\" role=\"img\" aria-label=\"Step {{ stepNo }} of 3\">\n          \u003Cspan class=\"demo-step\" data-on=\"{{ s1 }}\">\u003C/span>\n          \u003Cspan class=\"demo-step\" data-on=\"{{ s2 }}\">\u003C/span>\n          \u003Cspan class=\"demo-step\" data-on=\"{{ s3 }}\">\u003C/span>\n        \u003C/div>\n        \u003Cspan class=\"{{ stepChipClass }}\">{{ stepChip }}\u003C/span>\n      \u003C/div>\n\n      \u003Cdiv class=\"demo-body\">\n        \u003Cdiv>\n          \u003Cp class=\"small\">Labor, Austin South\u003C/p>\n          \u003Cp class=\"h3\" style=\"margin-top: 6px;\">{{ stepTitle }}\u003C/p>\n        \u003C/div>\n        \u003Cp class=\"body\">{{ stepBody }}\u003C/p>\n\n        \u003Cdiv class=\"demo-figures\">\n          \u003Cdiv class=\"demo-fig\">\n            \u003Cp class=\"small\">Hours paid, not used\u003C/p>\n            \u003Cp class=\"num\">{{ figHours }}\u003C/p>\n          \u003C/div>\n          \u003Cdiv class=\"demo-fig\">\n            \u003Cp class=\"small\">Weeks running\u003C/p>\n            \u003Cp class=\"num\">{{ figWeeks }}\u003C/p>\n          \u003C/div>\n          \u003Cdiv class=\"demo-fig\">\n            \u003Cp class=\"small\">{{ figMoneyLabel }}\u003C/p>\n            \u003Cp class=\"num\" style=\"color: var(--accent);\">{{ figMoney }}\u003C/p>\n          \u003C/div>\n        \u003C/div>\n\n        \u003Cdiv class=\"row\">\n          \u003Cbutton type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ advance }}\">{{ stepAction }}\u003C/button>\n          \u003Csc-if value=\"{{ atStart }}\" hint-placeholder-val=\"{{ true }}\">\n            \u003Cbutton type=\"button\" class=\"btn btn-ghost\">Ask the Kutlerri team\u003C/button>\n          \u003C/sc-if>\n        \u003C/div>\n        \u003Cp class=\"note\">Demo group. Example figures, not a live account.\u003C/p>\n      \u003C/div>\n    \u003C/div>\n\n    \u003Cdiv class=\"lanes decision-stack\" style=\"margin-top: clamp(28px, 3.5vw, 40px);\">\n      \u003Cdiv class=\"lane stack-card\">\n        \u003Cp class=\"h4\">Agents run it\u003C/p>\n        \u003Cdiv class=\"lane-list\">\n          \u003Cspan>Gather data across every system\u003C/span>\n          \u003Cspan>Forecast demand and prep\u003C/span>\n          \u003Cspan>Research and work prospects\u003C/span>\n          \u003Cspan>Monitor spend for leaks\u003C/span>\n          \u003Cspan>Prepare the recommendation\u003C/span>\n        \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"lane lane-mid stack-card\">\n        \u003Cp class=\"h4\">You approve it\u003C/p>\n        \u003Cdiv class=\"lane-list\">\n          \u003Cspan>Pricing changes\u003C/span>\n          \u003Cspan>Campaign changes\u003C/span>\n          \u003Cspan>Sensitive customer recovery\u003C/span>\n          \u003Cspan>Anything with real money attached\u003C/span>\n        \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"lane stack-card\">\n        \u003Cp class=\"h4\">Our team backs it\u003C/p>\n        \u003Cdiv class=\"lane-list\">\n          \u003Cspan>Managed execution end to end\u003C/span>\n          \u003Cspan>Exception handling\u003C/span>\n          \u003Cspan>Restaurant-specific judgment\u003C/span>\n        \u003C/div>\n      \u003C/div>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003C!-- ===================================================================== -->\n\u003C!-- Pricing.                                                               -->\n\u003C!-- ===================================================================== -->\n\u003Csection class=\"sec sunk\" id=\"pricing\">\n  \u003Cdiv class=\"wrap\">\n    \u003Cdiv class=\"narrow\" data-reveal>\n      \u003Ch2 class=\"h2\">We should win when you win.\u003C/h2>\n      \u003Cp class=\"body\" style=\"margin-top: 20px;\">Software normally charges you whether or not it produced anything. Where it applies, our economics are tied to the revenue created or the cost recovered, against a baseline we agree before starting.\u003C/p>\n    \u003C/div>\n\n    \u003Cdiv class=\"vs\" style=\"margin-top: clamp(28px, 3.5vw, 40px);\">\n      \u003Cdiv class=\"vs-col vs-old\">\n        \u003Cp class=\"h4\" style=\"color: inherit;\">Traditional software\u003C/p>\n        \u003Col>\n          \u003Cli>License fee\u003C/li>\n          \u003Cli>Implementation\u003C/li>\n          \u003Cli>You operate it\u003C/li>\n          \u003Cli>You carry the risk\u003C/li>\n        \u003C/ol>\n      \u003C/div>\n      \u003Cdiv class=\"vs-col vs-new\">\n        \u003Cp class=\"h4\" style=\"color: inherit;\">Kutlerri\u003C/p>\n        \u003Col>\n          \u003Cli>Outcome agreed\u003C/li>\n          \u003Cli>Agents and our team execute\u003C/li>\n          \u003Cli>Results measured against your baseline\u003C/li>\n          \u003Cli>Economics follow the result\u003C/li>\n        \u003C/ol>\n      \u003C/div>\n    \u003C/div>\n\n    \u003Ca href=\"#faq\" class=\"link-arrow\" style=\"margin-top: 26px;\">How we measure it \u003Cspan>&rarr;\u003C/span>\u003C/a>\n  \u003C/div>\n\u003C/section>\n\n\u003C!-- ===================================================================== -->\n\u003C!-- Customer proof plus two illustrative next-story opportunities.          -->\n\u003C!-- ===================================================================== -->\n\u003Csection class=\"sec\" id=\"rasa\">\n  \u003Cdiv class=\"wrap\">\n    \u003Cdiv class=\"panel\">\n      \u003Cdiv class=\"split split-wide-left\" style=\"align-items: center;\">\n        \u003Cdiv>\n          \u003Ch2 class=\"h2\" style=\"max-width: 18ch;\">From waiting for catering orders to going after them.\u003C/h2>\n          \u003Cp class=\"body\" style=\"margin-top: 20px; max-width: 42ch;\">RASA had catering demand and no way to chase it. Kutlerri mapped the market around each store, worked the prospects and kept the follow-up alive. No new sales hire, no paid ads, no discounting.\u003C/p>\n\n          \u003Cdiv style=\"margin-top: 32px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n            \u003Cspan class=\"num\" style=\"font-size: clamp(44px, 5.5vw, 64px); line-height: 1; color: var(--panel-ink);\">+31%\u003C/span>\n            \u003Cspan class=\"body\" style=\"color: var(--panel-ink-2);\">catering revenue over six months\u003C/span>\n          \u003C/div>\n\n          \u003Ca href=\"catering.html#rasa\" class=\"link-arrow\" style=\"margin-top: 28px; color: var(--panel-ink);\">Read the RASA story \u003Cspan>&rarr;\u003C/span>\u003C/a>\n        \u003C/div>\n\n        \u003Cfigure class=\"story-media\">\n          \u003Cimg src=\"public/kutlerri-rasa-office-catering-story.webp\" alt=\"Restaurant catering lead delivering lunch to an office\" width=\"1734\" height=\"920\" loading=\"lazy\">\n          \u003Cblockquote>\n            \u003Cp>“The pipeline is there every Monday now. We never hired a catering rep to build it.”\u003C/p>\n            \u003Cfigcaption>RASA, multi-location fast casual\u003C/figcaption>\n          \u003C/blockquote>\n        \u003C/figure>\n      \u003C/div>\n    \u003C/div>\n\n    \u003Cdiv class=\"story-next\" data-reveal>\n      \u003Cdiv>\n        \u003Cp class=\"outcome-kicker\">What could your next story be?\u003C/p>\n        \u003Ch3 class=\"h2\">A few profit signals worth investigating.\u003C/h3>\n      \u003C/div>\n      \u003Cp class=\"body\">Illustrative opportunities based on the patterns Kutlerri looks for. Your numbers come from your own systems and baseline.\u003C/p>\n    \u003C/div>\n\n    \u003Cdiv class=\"potential-story-grid\">\n      \u003Carticle class=\"potential-story potential-margin\" data-reveal>\n        \u003Cdiv class=\"potential-amount\">\n          \u003Cspan>Potential\u003C/span>\n          \u003Cstrong class=\"num\">$7.4K\u003C/strong>\n          \u003Csmall>margin recovered each month\u003C/small>\n        \u003C/div>\n        \u003Cdiv>\n          \u003Cp class=\"outcome-kicker\">Delivery spend\u003C/p>\n          \u003Ch3>A busy promotion was quietly losing money.\u003C/h3>\n          \u003Cp class=\"body\">Kutlerri connects promo spend, fees and contribution margin before the next cycle goes live.\u003C/p>\n          \u003Ca href=\"#directory\" class=\"link-arrow\">Meet the margin agents \u003Cspan>&rarr;\u003C/span>\u003C/a>\n        \u003C/div>\n      \u003C/article>\n\n      \u003Carticle class=\"potential-story potential-site\" data-reveal>\n        \u003Cdiv class=\"potential-amount\">\n          \u003Cspan>Decision at stake\u003C/span>\n          \u003Cstrong class=\"num\">$1.6M\u003C/strong>\n          \u003Csmall>modeled first-year sales\u003C/small>\n        \u003C/div>\n        \u003Cdiv>\n          \u003Cp class=\"outcome-kicker\">Site selection\u003C/p>\n          \u003Ch3>The obvious corner was not the strongest location.\u003C/h3>\n          \u003Cp class=\"body\">Kutlerri tests demand, cannibalization and trade-area economics before a lease becomes a fixed cost.\u003C/p>\n          \u003Ca href=\"#directory\" class=\"link-arrow\">Meet the expansion agent \u003Cspan>&rarr;\u003C/span>\u003C/a>\n        \u003C/div>\n      \u003C/article>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003C!-- ===================================================================== -->\n\u003C!-- Agent directory.                                                       -->\n\u003C!-- ===================================================================== -->\n\u003Csection class=\"sec sunk\" id=\"directory\">\n  \u003Cdiv class=\"wrap\">\n    \u003Cdiv class=\"split\" style=\"align-items: end;\" data-reveal>\n      \u003Ch2 class=\"h2\">The agents, by the outcome they own.\u003C/h2>\n      \u003Cdiv class=\"tabs\">\n        \u003Csc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          \u003Cbutton type=\"button\" class=\"tab\" aria-pressed=\"{{ t.on }}\" sc-camel-on-click=\"{{ t.select }}\">{{ t.label }}\u003C/button>\n        \u003C/sc-for>\n      \u003C/div>\n    \u003C/div>\n\n    \u003Cdiv class=\"agent-grid\" style=\"margin-top: clamp(24px, 3vw, 36px);\">\n      \u003Csc-for list=\"{{ agents }}\" as=\"a\" hint-placeholder-count=\"9\">\n        \u003Cdiv class=\"agent\">\n          \u003Cdiv class=\"between\" style=\"align-items: start;\">\n            \u003Cspan class=\"agent-icon {{ a.icon }}\" aria-hidden=\"true\">\u003C/span>\n            \u003Cspan class=\"{{ a.chipClass }}\">{{ a.status }}\u003C/span>\n          \u003C/div>\n          \u003Cp class=\"h4\">{{ a.name }}\u003C/p>\n          \u003Cp class=\"small\">{{ a.promise }}\u003C/p>\n        \u003C/div>\n      \u003C/sc-for>\n    \u003C/div>\n\n    \u003Cp class=\"small\" style=\"margin-top: 20px;\">Catering is live today. Agents marked monitored beta are running with operator partners under close supervision.\u003C/p>\n  \u003C/div>\n\u003C/section>\n\n\u003C!-- ===================================================================== -->\n\u003C!-- FAQ.                                                                   -->\n\u003C!-- ===================================================================== -->\n\u003Csection class=\"sec\" id=\"faq\">\n  \u003Cdiv class=\"wrap\" style=\"max-width: 840px;\">\n    \u003Ch2 class=\"h2\" data-reveal>Questions operators ask.\u003C/h2>\n    \u003Cdiv style=\"margin-top: clamp(24px, 3vw, 36px);\">\n      \u003Csc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"10\">\n        \u003Cdiv class=\"faq-item\">\n          \u003Cbutton type=\"button\" class=\"faq-q\" aria-expanded=\"{{ f.open }}\" sc-camel-on-click=\"{{ f.toggle }}\">\n            \u003Cspan>{{ f.q }}\u003C/span>\n            \u003Cspan class=\"faq-sign\" aria-hidden=\"true\" data-open=\"{{ f.open }}\">+\u003C/span>\n          \u003C/button>\n          \u003Csc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n            \u003Cp class=\"faq-a body\">{{ f.a }}\u003C/p>\n          \u003C/sc-if>\n        \u003C/div>\n      \u003C/sc-for>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003C/main>\n\n\u003C!-- ===================================================================== -->\n\u003C!-- Closing band. One CTA, one intent, matching the nav label.             -->\n\u003C!-- ===================================================================== -->\n\u003Csection class=\"band\" id=\"start\">\n  \u003Cdiv class=\"wrap split\" style=\"align-items: center;\">\n    \u003Cdiv>\n      \u003Ch2 class=\"h2\">Your P&amp;L already knows where the opportunities are.\u003C/h2>\n      \u003Cp class=\"body\" style=\"margin-top: 18px;\">Tell us the restaurant. We will walk you through what we would work on first, and the numbers we would use to measure it.\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"stack g16\" style=\"justify-items: start;\">\n      \u003Ca href=\"contact.html\" class=\"btn btn-primary\">Find my opportunities \u003Cspan class=\"btn-orb\" aria-hidden=\"true\">&rarr;\u003C/span>\u003C/a>\n      \u003Cp class=\"small\" style=\"color: var(--panel-ink-2);\">Built for groups of roughly three locations and up. Fully managed, so our team runs the analysis and the follow-through.\u003C/p>\n    \u003C/div>\n  \u003C/div>\n\u003C/section>\n\n\u003Cfooter class=\"site-footer\">\n  \u003Cdiv class=\"footer-grid\">\n    \u003Cdiv>\n      \u003Cspan class=\"brand\">\n        \u003Cimg src=\"https://kutlerri.ai/_next/static/media/WhiteLogo.b228db34.webp\"\n             alt=\"Kutlerri\" width=\"4354\" height=\"855\" loading=\"lazy\">\n      \u003C/span>\n      \u003Cp class=\"small\" style=\"color: var(--panel-ink-2); margin-top: 12px; max-width: 30ch;\">AI agents that find and deliver measurable restaurant profit.\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"footer-col\">\n      \u003Cp class=\"footer-head\">Product\u003C/p>\n      \u003Ca href=\"index.html#revenue\">Revenue\u003C/a>\n      \u003Ca href=\"index.html#margin\">Margin\u003C/a>\n      \u003Ca href=\"index.html#expansion\">Expansion\u003C/a>\n      \u003Ca href=\"catering.html\">Catering\u003C/a>\n    \u003C/div>\n    \u003Cdiv class=\"footer-col\">\n      \u003Cp class=\"footer-head\">Company\u003C/p>\n      \u003Ca href=\"about.html\">About\u003C/a>\n      \u003Ca href=\"index.html#rasa\">Customers\u003C/a>\n      \u003Ca href=\"index.html#how\">How it works\u003C/a>\n      \u003Ca href=\"contact.html\">Contact\u003C/a>\n    \u003C/div>\n    \u003Cdiv class=\"footer-col\">\n      \u003Cp class=\"footer-head\">Legal\u003C/p>\n      \u003Cspan aria-disabled=\"true\">Privacy policy\u003C/span>\n      \u003Cspan aria-disabled=\"true\">Terms and conditions\u003C/span>\n    \u003C/div>\n  \u003C/div>\n  \u003Cdiv class=\"footer-base\">\n    \u003Cp>Figures shown on this site are examples from a demo restaurant group. &copy; 2026 Kutlerri.\u003C/p>\n  \u003C/div>\n\u003C/footer>\n\n\u003C/x-dc>\n\u003Cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { openFaq: 0, tab: \"All\", step: 0 };\n\n  componentDidMount() {\n    this._onKey = (ev) => {\n      if (ev.key === \"Escape\") {\n        const open = document.querySelector(\".nav-toggle[open]\");\n        if (open) open.removeAttribute(\"open\");\n      }\n    };\n    document.addEventListener(\"keydown\", this._onKey);\n\n    const reduce = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    const gsap = window.gsap;\n    const ScrollTrigger = window.ScrollTrigger;\n    if (reduce || !gsap || !ScrollTrigger) return;\n\n    gsap.registerPlugin(ScrollTrigger);\n    this._gsapCtx = gsap.context(() => {\n      gsap.from(\".hero-copy > *\", {\n        opacity: 0,\n        y: 34,\n        duration: 1.15,\n        stagger: 0.12,\n        ease: \"power4.out\"\n      });\n\n      gsap.fromTo(\".hero-media img\",\n        { scale: 0.92, opacity: 0.68 },\n        {\n          scale: 1.08,\n          opacity: 0.24,\n          ease: \"none\",\n          scrollTrigger: {\n            trigger: \".hero-cinematic\",\n            start: \"top top\",\n            end: \"bottom top\",\n            scrub: 1\n          }\n        }\n      );\n\n      gsap.utils.toArray(\".outcome-card\").forEach((card) => {\n        gsap.fromTo(card,\n          { scale: 0.88, opacity: 0.28 },\n          {\n            scale: 1,\n            opacity: 1,\n            ease: \"none\",\n            scrollTrigger: {\n              trigger: card,\n              start: \"top bottom\",\n              end: \"top 42%\",\n              scrub: 0.8\n            }\n          }\n        );\n      });\n\n      if (window.matchMedia(\"(min-width: 860px)\").matches) {\n        const cards = gsap.utils.toArray(\".decision-stack .stack-card\");\n        cards.forEach((card, index) => {\n          if (index === cards.length - 1) return;\n          ScrollTrigger.create({\n            trigger: card,\n            start: \"top top\",\n            endTrigger: cards[cards.length - 1],\n            end: \"top top\",\n            pin: true,\n            pinSpacing: false\n          });\n          gsap.to(card, {\n            scale: 0.91,\n            opacity: 0.38,\n            rotateX: -4,\n            ease: \"none\",\n            scrollTrigger: {\n              trigger: cards[index + 1],\n              start: \"top bottom\",\n              end: \"top top\",\n              scrub: 1\n            }\n          });\n        });\n      }\n    });\n  }\n\n  componentWillUnmount() {\n    if (this._onKey) document.removeEventListener(\"keydown\", this._onKey);\n    if (this._gsapCtx) this._gsapCtx.revert();\n  }\n\n  renderVals() {\n    // --- FAQ ---------------------------------------------------------------\n    const faqData = [\n      [\"What exactly is an AI agent?\", \"Software that owns one job end to end. It pulls the data, works out what to do, prepares the recommendation, and where you allow it, carries out the routine steps.\"],\n      [\"Does Kutlerri replace our POS?\", \"No. Your POS stays where it is. Kutlerri reads from it.\"],\n      [\"What systems does Kutlerri connect to?\", \"POS, delivery marketplaces, labor, inventory, reviews, accounting and catering tools. We confirm the exact connections during onboarding.\"],\n      [\"Does my team have to operate the agents?\", \"No. Recommendations arrive as decisions with a dollar amount attached. Most operators only touch approvals.\"],\n      [\"What does fully managed mean?\", \"Our team runs the analysis, the outreach and the follow-through as an extension of yours. You are not handed a login and left with it.\"],\n      [\"Which agents are available today?\", \"Catering is live. The others are in closely monitored beta with operator partners.\"],\n      [\"How does outcome-based pricing work?\", \"Where it applies, our economics are tied to the revenue created or the cost recovered. We agree the outcome and how it gets measured before we start.\"],\n      [\"How do you measure the impact?\", \"Against your own baseline: catering revenue, contribution on promotional spend, prep variance, scheduled hours against needed hours.\"],\n      [\"Does Kutlerri make changes automatically?\", \"Only the routine work you approved in advance. Pricing, campaigns and anything with real money attached waits for a human.\"],\n      [\"Does Kutlerri work for single-location restaurants?\", \"It is built for groups of roughly three locations and up. A single site can still use catering, though the economics work best across several stores.\"],\n      [\"What happens to our restaurant data?\", \"It stays yours. We use it to run your agents and produce your recommendations.\"]\n    ];\n\n    const faqs = faqData.map(([q, a], i) => ({\n      q: q,\n      a: a,\n      open: this.state.openFaq === i,\n      toggle: () => this.setState({ openFaq: this.state.openFaq === i ? -1 : i })\n    }));\n\n    // --- Agent directory ---------------------------------------------------\n    const BETA = \"Monitored beta\";\n    const all = [\n      [\"Catering\", \"Build a repeatable corporate catering engine.\", \"Live\", \"Grow revenue\", \"icon-catering\"],\n      [\"Menu Engineering\", \"Fix the items quietly killing your margin.\", BETA, \"Grow revenue\", \"icon-menu\"],\n      [\"Guest Retention\", \"Catch valuable guests before they disappear.\", BETA, \"Grow revenue\", \"icon-retention\"],\n      [\"Review Recovery\", \"Know when a bad night costs you a regular.\", BETA, \"Grow revenue\", \"icon-review\"],\n      [\"Prep Forecast\", \"Know what to prep before the waste happens.\", BETA, \"Protect margin\", \"icon-prep\"],\n      [\"Waste Control\", \"Stop paying twice for the same ingredient.\", BETA, \"Protect margin\", \"icon-waste\"],\n      [\"Labor Scheduling\", \"Find the shifts you pay for and do not use.\", BETA, \"Protect margin\", \"icon-labor\"],\n      [\"Delivery Spend\", \"Stop funding promos that lose money.\", BETA, \"Protect margin\", \"icon-delivery\"],\n      [\"Site Selection\", \"Judge a location before you sign the lease.\", BETA, \"Expand\", \"icon-site\"]\n    ];\n\n    const tabs = [\"All\", \"Grow revenue\", \"Protect margin\", \"Expand\"].map((g) => ({\n      label: g,\n      on: this.state.tab === g,\n      select: () => this.setState({ tab: g })\n    }));\n\n    const agents = all\n      .filter((row) => this.state.tab === \"All\" || row[3] === this.state.tab)\n      .map((row) => ({\n        name: row[0],\n        promise: row[1],\n        status: row[2],\n        icon: row[4],\n        chipClass: row[2] === \"Live\" ? \"chip\" : \"chip chip-quiet\"\n      }));\n\n    // --- Approval demo -----------------------------------------------------\n    // Three states of one real recommendation. The figures change with the\n    // step, so the reader watches the same decision move rather than reading\n    // three separate cards.\n    const steps = [\n      {\n        chip: \"Needs your decision\",\n        chipClass: \"chip chip-warn\",\n        title: \"Tuesday afternoons are overstaffed.\",\n        body: \"Six of the last eight weeks, Austin South has carried more hours between 2 and 5 PM than the covers justify. Dropping one person from that window is the smallest change that closes it.\",\n        hours: \"11\",\n        weeks: \"6 of 8\",\n        moneyLabel: \"Worth a month\",\n        money: \"$1,084\",\n        action: \"Approve the change\"\n      },\n      {\n        chip: \"In progress\",\n        chipClass: \"chip\",\n        title: \"Approved. The schedule is already updated.\",\n        body: \"The Tuesday afternoon shift is rebuilt from next week. Our team is watching service times for the first three weeks in case the covers move and the hours need to come back.\",\n        hours: \"0\",\n        weeks: \"3 to watch\",\n        moneyLabel: \"Expected a month\",\n        money: \"$1,084\",\n        action: \"See the result\"\n      },\n      {\n        chip: \"Measured\",\n        chipClass: \"chip\",\n        title: \"Logged against the baseline we agreed.\",\n        body: \"Labor cost at Austin South came down without service times moving. It lands on the line you already track, measured the way we said it would be at kickoff.\",\n        hours: \"0\",\n        weeks: \"Held\",\n        moneyLabel: \"Recovered, first month\",\n        money: \"$1,032\",\n        action: \"Start over\"\n      }\n    ];\n    const i = this.state.step;\n    const s = steps[i];\n\n    return {\n      systems: [\"POS\", \"DoorDash\", \"Uber Eats\", \"Labor\", \"Inventory\", \"Reviews\", \"Accounting\", \"Catering\", \"Guest data\"],\n\n      // Three flat lists rather than a nested loop, so each phase renders on\n      // its own and the markup stays one level deep.\n      morning: [\n        { at: \"7:10 AM\", what: \"Prep Forecast sends every kitchen its plan for the day.\", who: \"Prep Forecast, all stores\" },\n        { at: \"9:20 AM\", what: \"Catering finds a new corporate buyer a mile from Austin South.\", who: \"Catering, Austin South\" }\n      ],\n      midday: [\n        { at: \"11:40 AM\", what: \"An inbound catering request gets quoted and followed up.\", who: \"Catering, Store 03\" },\n        { at: \"2:15 PM\", what: \"Waste Control spots the avocado order running long again.\", who: \"Waste Control, Austin South\" }\n      ],\n      close: [\n        { at: \"3:30 PM\", what: \"Delivery Spend flags a DoorDash promo that is losing money.\", who: \"Delivery Spend, DoorDash\" },\n        { at: \"5:10 PM\", what: \"A loyal guest leaves a one-star review and a manager hears about it.\", who: \"Review Recovery, Store 04\" }\n      ],\n\n      faqs: faqs,\n      tabs: tabs,\n      agents: agents,\n\n      stepNo: i + 1,\n      s1: i >= 0,\n      s2: i >= 1,\n      s3: i >= 2,\n      atStart: i === 0,\n      stepChip: s.chip,\n      stepChipClass: s.chipClass,\n      stepTitle: s.title,\n      stepBody: s.body,\n      stepAction: s.action,\n      figHours: s.hours,\n      figWeeks: s.weeks,\n      figMoneyLabel: s.moneyLabel,\n      figMoney: s.money,\n      advance: () => this.setState({ step: (this.state.step + 1) % 3 })\n    };\n  }\n}\n\u003C/script>\n\u003C/body>\u003C/html>"
  </script>
</body>
</html>
