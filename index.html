document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

off2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"f4351a72-902b-475f-b674-6ef0d917a246\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"702c97fc-0176-4db9-8978-231e754a6c99\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d71209af-06b8-49ee-88f5-682cf1759b3f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"5b56f876-fbcb-4466-9383-4a3b33d898e4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\u003C/style>\n\u003Cstyle>\n/* ==========================================================================\n   Kutlerri design system\n   Native CSS only: custom properties, grid, and scroll-driven animation.\n   No framework, no animation library, no icon dependency.\n\n   Locks, audited on every page:\n     Accent    one forest green. --warn is reserved for genuine negative\n               state (money lost, a decision pending). Never decorative.\n     Radius    10 / 14 / 20 / 28. Controls 10, cards 14, panels 20, band 28.\n     Theme     one light theme, whole site. No section inverts except the\n               single brand panel, which is a deliberate one-per-page block.\n     Charts    magnitude uses the sequential ramp (--seq-*), one hue,\n               light to dark. Emphasis figures use accent + --mute only.\n   ========================================================================== */\n\n@font-face {\n  font-family: \"Geist\";\n  src: url(\"public/Geist-Regular.woff2\") format(\"woff2\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Geist\";\n  src: url(\"public/Geist-Medium.woff2\") format(\"woff2\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Geist\";\n  src: url(\"public/Geist-SemiBold.woff2\") format(\"woff2\");\n  font-weight: 600 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  color-scheme: dark;\n\n  /* A single deep-forest world with enough tonal range to create depth. */\n  --bg: #07100D;\n  --bg-sunk: #0A1712;\n  --surface: #102019;\n  --surface-2: #14271E;\n\n  --ink: #F1F5EE;\n  --ink-2: #B8C6BA;\n  --ink-3: #87988B;\n\n  --line: rgba(210, 242, 218, .11);\n  --line-2: rgba(210, 242, 218, .2);\n\n  --accent: #66D985;\n  --accent-hover: #84E79E;\n  --accent-soft: #173B25;\n  --accent-lift: #72B983;\n  --accent-shade: #0B2A16;\n  --on-accent: #07110A;\n\n  /* Sequential ramp for magnitude. Validated light to dark, single hue,\n     light end clears 2:1 against white. Do not reorder. */\n  --seq-1: #3F664A;\n  --seq-2: #4F965F;\n  --seq-3: #66D985;\n\n  /* Emphasis figures: everything that is context, not the point. */\n  --mute: #65766A;\n\n  --warn: #E38B68;\n  --warn-soft: #3E211B;\n\n  /* Brand band. One deep-green surface, used once per page. */\n  --panel: #0D1D16;\n  --panel-2: #14291D;\n  --panel-ink: #F1F5EE;\n  --panel-ink-2: #A9B9AC;\n  --panel-line: rgba(216, 242, 222, .15);\n\n  --r-sm: 12px;\n  --r-md: 20px;\n  --r-lg: 28px;\n  --r-xl: 36px;\n\n  --shadow-1: 0 1px 1px rgba(126, 223, 150, .07), 0 24px 64px -36px rgba(35, 117, 60, .58);\n  --shadow-2: 0 2px 2px rgba(126, 223, 150, .08), 0 42px 90px -46px rgba(35, 117, 60, .7);\n\n  --sans: \"Geist\", \"Avenir Next\", system-ui, sans-serif;\n  --mono: \"IBM Plex Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  --maxw: 1320px;\n  --gutter: clamp(20px, 4vw, 40px);\n  --sec-y: clamp(92px, 10vw, 156px);\n}\n\n/* -------------------------------------------------------------------------- */\n/* Base                                                                       */\n/* -------------------------------------------------------------------------- */\n\n* { box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; scroll-padding-top: 84px; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: 16px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  text-wrap: pretty;\n  /* The hero deck sits slightly outside its box on wide viewports. */\n  overflow-x: clip;\n  background-image:\n    radial-gradient(circle at 12% 12%, rgba(82, 181, 106, .08), transparent 28rem),\n    radial-gradient(circle at 88% 55%, rgba(32, 102, 53, .09), transparent 34rem);\n}\n\nbody::before {\n  content: \"\";\n  position: fixed;\n  inset: 0;\n  z-index: 60;\n  pointer-events: none;\n  opacity: .032;\n  background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E\");\n}\n\nh1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.028em; text-wrap: balance; }\np { margin: 0; }\nimg { max-width: 100%; display: block; }\nbutton { font: inherit; color: inherit; }\n\na { color: var(--accent); text-decoration: none; transition: color .55s cubic-bezier(.16, 1, .3, 1); }\na:hover { color: var(--accent-hover); }\n\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--r-sm); }\n\n.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }\n.sec { padding-block: var(--sec-y); }\n.sunk {\n  background:\n    radial-gradient(circle at 8% 20%, rgba(102, 217, 133, .055), transparent 26rem),\n    var(--bg-sunk);\n}\n.narrow { max-width: 780px; }\n\n/* The page's one centred moment, larger than an h2. Used once, on the thesis\n   section, so the eye has somewhere to land between eight left-aligned heads. */\n.statement { font-size: clamp(30px, 4.2vw, 54px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 600; text-wrap: balance; }\n\n.h1 { font-size: clamp(44px, 6.4vw, 88px); line-height: .94; letter-spacing: -.055em; }\n.h2 { font-size: clamp(34px, 4.3vw, 60px); line-height: 1; letter-spacing: -.045em; }\n.h3 { font-size: clamp(20px, 1.9vw, 25px); line-height: 1.2; }\n.h4 { font-size: 17px; line-height: 1.3; letter-spacing: -0.015em; }\n\n.lede { font-size: clamp(17px, 1.4vw, 20px); line-height: 1.5; color: var(--ink-2); max-width: 32em; }\n.body { font-size: 16px; line-height: 1.6; color: var(--ink-2); max-width: 62ch; }\n.small { font-size: 14px; line-height: 1.5; color: var(--ink-3); }\n.tiny { font-size: 12px; line-height: 1.45; color: var(--ink-3); }\n.note { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; color: var(--ink-3); }\n\n.num { font-variant-numeric: tabular-nums; letter-spacing: -0.025em; font-weight: 600; }\n.neg { color: var(--warn); }\n\n/* -------------------------------------------------------------------------- */\n/* Controls                                                                   */\n/* -------------------------------------------------------------------------- */\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  padding: 9px 10px 9px 22px;\n  min-height: 50px;\n  border-radius: 999px;\n  border: 1px solid transparent;\n  font-size: 15px;\n  font-weight: 500;\n  line-height: 1.2;\n  white-space: nowrap;\n  cursor: pointer;\n  transition: background .65s cubic-bezier(.16, 1, .3, 1), color .65s cubic-bezier(.16, 1, .3, 1), border-color .65s cubic-bezier(.16, 1, .3, 1), transform .28s cubic-bezier(.16, 1, .3, 1);\n}\n.btn:active { transform: scale(.98); }\n.btn:disabled { cursor: default; opacity: .55; }\n\n.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .34), 0 16px 38px -24px rgba(102, 217, 133, .9); }\n.btn-primary:hover { background: var(--accent-hover); color: var(--on-accent); transform: translateY(-2px); }\n\n.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }\n.btn-ghost:hover { background: var(--surface); border-color: var(--ink-3); color: var(--ink); }\n\n.btn-sm { padding: 7px 8px 7px 16px; min-height: 42px; font-size: 13.5px; }\n\n.btn-orb {\n  width: 32px;\n  height: 32px;\n  border-radius: 50%;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  background: rgba(7, 17, 10, .12);\n  transition: transform .65s cubic-bezier(.16, 1, .3, 1), background .65s cubic-bezier(.16, 1, .3, 1);\n}\n.btn:hover .btn-orb { transform: translate(3px, -1px) scale(1.06); background: rgba(7, 17, 10, .2); }\n\n.link-arrow { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; color: var(--accent); }\n.link-arrow span { transition: transform .2s cubic-bezier(.16, 1, .3, 1); }\n.link-arrow:hover span { transform: translateX(4px); }\n\n.chip {\n  display: inline-flex;\n  align-items: center;\n  padding: 6px 12px;\n  border-radius: var(--r-sm);\n  font-size: 12.5px;\n  font-weight: 500;\n  line-height: 1.3;\n  background: var(--accent-soft);\n  color: var(--accent);\n}\n.chip-warn { background: var(--warn-soft); color: var(--warn); }\n.chip-quiet { background: var(--bg-sunk); color: var(--ink-3); }\n\n.field { display: grid; gap: 6px; }\n.field label { font-size: 13.5px; font-weight: 500; color: var(--ink-2); }\n.field input, .field textarea, .field sc-raw-select, .field select {\n  width: 100%;\n  padding: 12px 14px;\n  border-radius: var(--r-sm);\n  border: 1px solid var(--line-2);\n  background: var(--surface);\n  color: var(--ink);\n  font: inherit;\n  font-size: 15px;\n  transition: border-color .18s ease;\n}\n.field textarea { resize: vertical; min-height: 118px; }\n.field input::placeholder, .field textarea::placeholder { color: var(--ink-3); opacity: 1; }\n.field input:hover, .field textarea:hover { border-color: var(--ink-3); }\n.field input:focus-visible, .field textarea:focus-visible { border-color: var(--accent); outline-offset: 1px; }\n.field .hint { font-size: 12.5px; color: var(--ink-3); }\n\n/* -------------------------------------------------------------------------- */\n/* Surfaces                                                                   */\n/* -------------------------------------------------------------------------- */\n\n.card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  padding: clamp(20px, 2.2vw, 28px);\n  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045), var(--shadow-1);\n}\n.card-quiet { background: var(--surface-2); }\n.card-tint { background: var(--accent-soft); border-color: transparent; }\n\n.panel {\n  background: var(--panel);\n  color: var(--panel-ink);\n  border: 1px solid var(--panel-line);\n  border-radius: var(--r-xl);\n  padding: clamp(28px, 4vw, 56px);\n  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), var(--shadow-2);\n}\n.panel h2, .panel h3 { color: var(--panel-ink); }\n.panel .body, .panel .small, .panel .tiny { color: var(--panel-ink-2); }\n.panel a { color: var(--panel-ink); }\n.panel a:hover { color: var(--ink); }\n\n.rule { height: 1px; background: var(--line); border: 0; margin: 0; }\n\n/* -------------------------------------------------------------------------- */\n/* Layout helpers                                                             */\n/* -------------------------------------------------------------------------- */\n\n.stack { display: grid; align-content: start; }\n.g8 { gap: 8px; } .g12 { gap: 12px; } .g16 { gap: 16px; }\n.g24 { gap: 24px; } .g32 { gap: 32px; }\n\n.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }\n.between { display: flex; align-items: center; justify-content: space-between; gap: 16px; }\n.between > * { min-width: 0; }\n\n.grid { display: grid; gap: clamp(16px, 1.8vw, 22px); }\n.cols-2, .cols-3 { grid-template-columns: minmax(0, 1fr); }\n.split { display: grid; gap: clamp(32px, 5vw, 68px); align-items: center; }\n\n@media (min-width: 760px) {\n  .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n}\n@media (min-width: 1000px) {\n  .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }\n  .split-wide-left { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }\n  .split-wide-right { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }\n}\n\n/* Section head. Headline stacked over body, never a corner floater. */\n.head { max-width: 22ch; }\n.head + .body { margin-top: 18px; }\n\n/* -------------------------------------------------------------------------- */\n/* Motion                                                                     */\n/*                                                                            */\n/* Two devices only, both native scroll-driven, no listener and no library.    */\n/* Reveal communicates reading order. Chart grow communicates magnitude        */\n/* arriving. Everything else on the page is still on purpose.                  */\n/* -------------------------------------------------------------------------- */\n\n@keyframes k-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }\n@keyframes k-grow { from { transform: scaleX(0); } to { transform: none; } }\n@keyframes k-slide { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }\n\n@supports (animation-timeline: view()) {\n  @media (prefers-reduced-motion: no-preference) and (min-width: 760px) {\n    /* Slide only, never opacity. A view() timeline holds an element at its\n       start keyframe until it enters, so fading in from 0 means anything the\n       timeline never evaluates renders invisible. A 20px offset degrades to\n       \"sits 20px low\", which nobody will ever notice. Content is never hidden\n       by decoration. */\n    [data-reveal] {\n      animation: k-reveal linear both;\n      animation-timeline: view();\n      animation-range: entry 5% entry 50%;\n    }\n    /* Bars only. The dots carry translateX(-50%) for positioning, and a\n       transform animation would overwrite it and land them off their marks. */\n    .bar-fill {\n      animation: k-grow linear both;\n      animation-timeline: view();\n      animation-range: entry 15% entry 65%;\n    }\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation: none !important; transition-duration: .001ms !important; }\n  html { scroll-behavior: auto; }\n}\n\n/* -------------------------------------------------------------------------- */\n/* Header. One nav, identical on every page.                                  */\n/* -------------------------------------------------------------------------- */\n\n.site-header {\n  position: sticky;\n  top: 14px;\n  z-index: 40;\n  width: min(calc(100% - 28px), 1240px);\n  margin: 14px auto 0;\n  background: rgba(10, 23, 18, .84);\n  border: 1px solid var(--line);\n  border-radius: 999px;\n  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 22px 70px -36px rgba(29, 112, 52, .72);\n}\n@supports (backdrop-filter: blur(10px)) {\n  .site-header { background: rgba(10, 23, 18, .72); backdrop-filter: blur(20px) saturate(140%); }\n}\n\n.nav {\n  max-width: var(--maxw);\n  margin: 0 auto;\n  min-height: 64px;\n  padding-inline: var(--gutter);\n  display: flex;\n  align-items: center;\n  gap: 28px;\n}\n\n/* Both legacy lockups are recolored as one emerald mark. */\n.brand { display: block; flex: none; width: 136px; height: 27px; }\n.brand img { width: 100%; height: 100%; object-fit: contain; object-position: left center; }\n.brand img { filter: brightness(0) saturate(100%) invert(77%) sepia(22%) saturate(1128%) hue-rotate(82deg) brightness(97%) contrast(91%); }\n.brand:hover img { opacity: .76; transition: opacity .55s cubic-bezier(.16, 1, .3, 1); }\n\n.skip-link {\n  position: fixed;\n  left: 20px;\n  top: 12px;\n  z-index: 70;\n  padding: 10px 14px;\n  background: var(--accent);\n  color: var(--on-accent);\n  border-radius: var(--r-sm);\n  transform: translateY(-180%);\n}\n.skip-link:focus { transform: translateY(0); }\n\n.nav-links { display: none; align-items: center; gap: 24px; flex: 1; }\n.nav-links a { font-size: 15px; color: var(--ink); white-space: nowrap; }\n.nav-links a:hover { color: var(--accent); }\n.nav-links a[aria-current=\"page\"] { color: var(--accent); font-weight: 500; }\n.nav-actions { display: flex; align-items: center; gap: 14px; margin-left: auto; flex: none; }\n\n@media (min-width: 940px) {\n  .nav-links { display: flex; }\n  .nav-toggle { display: none; }\n}\n@media (max-width: 939px) {\n  .nav-actions { display: none; }\n  .brand { width: 124px; height: 25px; }\n}\n\n/* Mobile nav. A native disclosure, so it needs no script and no focus trap. */\n.nav-toggle { margin-left: auto; }\n.nav-toggle > summary {\n  list-style: none;\n  cursor: pointer;\n  padding: 9px 14px;\n  border: 1px solid var(--line-2);\n  border-radius: var(--r-sm);\n  font-size: 14px;\n  font-weight: 500;\n}\n.nav-toggle > summary::-webkit-details-marker { display: none; }\n.nav-toggle[open] > summary { border-color: var(--ink-3); }\n.nav-menu {\n  position: absolute;\n  left: var(--gutter);\n  right: var(--gutter);\n  margin-top: 12px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-md);\n  box-shadow: var(--shadow-2);\n  padding: 8px;\n  display: grid;\n  gap: 2px;\n  animation: k-rise .16s cubic-bezier(.16, 1, .3, 1) both;\n}\n.nav-menu a { display: block; padding: 12px 14px; border-radius: var(--r-sm); color: var(--ink); font-size: 15px; }\n.nav-menu a:hover { background: var(--accent-soft); color: var(--accent); }\n\n/* -------------------------------------------------------------------------- */\n/* Hero                                                                       */\n/* -------------------------------------------------------------------------- */\n\n.hero {\n  max-width: var(--maxw);\n  margin: 0 auto;\n  padding: clamp(32px, 4vw, 64px) var(--gutter) clamp(48px, 6vw, 88px);\n  display: grid;\n  gap: clamp(36px, 5vw, 60px);\n  align-items: center;\n}\n@media (min-width: 1000px) { .hero { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); } }\n\n.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }\n\n/* -------------------------------------------------------------------------- */\n/* The profit stair.                                                          */\n/*                                                                            */\n/* Outcomes, not activity: three things that already went the operator's way   */\n/* this week, each one a solid slab stepping up and forward, resolving into    */\n/* what they came to. The ascending shape carries the meaning before a single  */\n/* word is read.                                                               */\n/*                                                                            */\n/* Two earlier attempts failed here and both are worth remembering. A rotated  */\n/* ground plane at 57deg showed only top faces, so nothing had volume. A       */\n/* white-on-white ledger with outlined rows had no contrast, so nothing read   */\n/* as lifted. Depth needs BOTH a solid edge and a tonal step against what sits */\n/* behind it. This has both.                                                   */\n/* -------------------------------------------------------------------------- */\n\n.stair {\n  perspective: 1600px;\n  perspective-origin: 58% 45%;\n  --px: 0;\n  --py: 0;\n}\n\n/* Narrower than its column and pinned right: the deck rotation swings the\n   near edge outward and needs slack on that side or the slabs clip. */\n.stair-deck {\n  position: relative;\n  width: 86%;\n  margin-left: auto;\n  height: 452px;\n  transform-style: preserve-3d;\n  transform: rotateX(calc(8deg + var(--py) * -3deg)) rotateY(calc(-13deg + var(--px) * 5deg));\n  transition: transform .7s cubic-bezier(.16, 1, .3, 1);\n}\n\n.slab {\n  position: absolute;\n  left: 0;\n  right: 0;\n  transform: translate3d(var(--tx, 0px), var(--ty, 0px), var(--tz, 0px));\n  background: var(--surface);\n  border-radius: var(--r-md);\n  padding: 17px 21px;\n  /* The hard, unblurred offset IS the slab's edge. It reads as thickness from\n     any angle, unlike a second Z-plane, which hides behind its own face at a\n     shallow rotation. The blurred pair underneath is the cast shadow. */\n  box-shadow: 7px 9px 0 var(--seq-1), 0 34px 44px -30px rgba(19, 22, 19, .5);\n  animation: slab-in .55s cubic-bezier(.16, 1, .3, 1) both;\n}\n\n.slab-tag {\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  margin-bottom: 7px;\n}\n.slab-line { font-size: 15px; line-height: 1.4; }\n\n/* Stepping up and toward the reader. Every offset is zero or negative, so\n   nothing travels toward the edge that clips. */\n.slab-1 { --ty: 296px; --tz: -150px; --tx: -38px; animation-delay: .05s; }\n.slab-2 { --ty: 200px; --tz: -80px;  --tx: -22px; animation-delay: .17s; }\n.slab-3 { --ty: 104px; --tz: -10px;  --tx: -8px;  animation-delay: .29s; }\n\n/* The outcome. Top of the stair, nearest the reader, and the only figure on\n   the whole screen. */\n.slab-total {\n  --ty: 0px;\n  --tz: 76px;\n  --tx: 0px;\n  background: var(--accent);\n  color: var(--on-accent);\n  padding: 20px 22px;\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 16px;\n  flex-wrap: wrap;\n  box-shadow: 7px 9px 0 var(--accent-shade), 0 44px 56px -30px rgba(19, 22, 19, .55);\n  animation: slab-in .55s cubic-bezier(.16, 1, .3, 1) .41s both,\n             slab-float 7s cubic-bezier(.45, .05, .55, .95) 1.1s infinite;\n}\n.slab-total .slab-tag { color: var(--accent-soft); margin-bottom: 0; }\n\n/* Both keyframe sets restate the positioning transform, so neither can strand\n   a slab off its mark the way a bare scaleX would. */\n@keyframes slab-in {\n  from { opacity: 0; transform: translate3d(var(--tx), calc(var(--ty) + 34px), var(--tz)); }\n  to   { opacity: 1; transform: translate3d(var(--tx), var(--ty), var(--tz)); }\n}\n@keyframes slab-float {\n  0%, 100% { transform: translate3d(var(--tx), var(--ty), var(--tz)); }\n  50%      { transform: translate3d(var(--tx), calc(var(--ty) - 9px), var(--tz)); }\n}\n\n/* Narrow viewports and reduced motion get a plain stack. A rotated 3D object\n   inside a 360px column is noise, and every slab reads without the tilt. */\n@media (max-width: 999px), (prefers-reduced-motion: reduce) {\n  .stair { perspective: none; }\n  .stair-deck { width: 100%; height: auto; transform: none; transform-style: flat; display: grid; gap: 12px; }\n  .slab { position: static; transform: none; box-shadow: var(--shadow-1); animation: none; }\n  .slab-total { animation: none; box-shadow: var(--shadow-1); }\n}\n\n/* Media frame. Fixed ratio so nothing shifts while the photo loads. */\n.shot { position: relative; overflow: hidden; border-radius: var(--r-lg); background: var(--bg-sunk); aspect-ratio: 4 / 5; }\n.shot-wide { aspect-ratio: 4 / 3; }\n.shot img { width: 100%; height: 100%; object-fit: cover; }\n/* A single duotone wash, so stock photography reads as brand rather than stock. */\n.shot img { filter: grayscale(1) contrast(1.06); }\n.shot::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(205deg, rgba(46, 74, 51, .42), rgba(30, 47, 33, .78));\n  mix-blend-mode: multiply;\n}\n\n/* -------------------------------------------------------------------------- */\n/* Scroll-snap pills. The right component for a list past five items.         */\n/* -------------------------------------------------------------------------- */\n\n.pills { display: flex; flex-wrap: wrap; gap: 8px; }\n.pill {\n  padding: 8px 14px;\n  border-radius: var(--r-sm);\n  border: 1px solid var(--line-2);\n  background: var(--surface);\n  font-size: 14px;\n  color: var(--ink-2);\n  white-space: nowrap;\n}\n\n/* -------------------------------------------------------------------------- */\n/* Figures                                                                    */\n/*                                                                            */\n/* Two chart forms, each chosen for its job. Bars carry magnitude and use the  */\n/* sequential ramp. The scale carries emphasis: one candidate against context, */\n/* accent plus mute, with shape doing the work color cannot.                   */\n/* -------------------------------------------------------------------------- */\n\nfigure { margin: 0; }\n.fig-cap { font-size: 13px; color: var(--ink-3); margin-top: 14px; }\n\n/* Magnitude bars. Thin marks, hairline baseline, direct labels, no track. */\n.bars { display: grid; gap: 16px; }\n.bar-row { display: grid; grid-template-columns: minmax(78px, auto) minmax(0, 1fr) auto; align-items: center; gap: 16px; }\n.bar-label { font-size: 14px; color: var(--ink-2); }\n.bar-track { height: 14px; }\n.bar-fill {\n  height: 100%;\n  width: var(--w);\n  background: var(--c, var(--seq-2));\n  border-radius: 0 4px 4px 0;\n  transform-origin: left center;\n}\n.bar-val { font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }\n\n/* Emphasis scale. One axis, marks placed by value, candidate called out. */\n.dot-scale { position: relative; height: 128px; margin-top: 12px; }\n.dot-axis { position: absolute; left: 0; right: 0; bottom: 34px; height: 1px; background: var(--line-2); }\n.dot-tick { position: absolute; bottom: 12px; transform: translateX(-50%); font-size: 12px; color: var(--ink-3); white-space: nowrap; }\n.dot-tick::before { content: \"\"; position: absolute; left: 50%; bottom: 20px; width: 1px; height: 6px; background: var(--line-2); }\n.dot {\n  position: absolute;\n  bottom: 28px;\n  left: var(--x);\n  width: 13px;\n  height: 13px;\n  border-radius: 50%;\n  transform: translateX(-50%);\n  transform-origin: center bottom;\n}\n/* Context: your own stores, one hue step back. */\n.dot-mine { background: var(--accent-lift); box-shadow: 0 0 0 2px var(--surface); }\n/* Context: rivals. Hollow, so identity survives without relying on colour. */\n.dot-rival { background: var(--surface); border: 2px solid var(--mute); }\n/* The point of the figure. */\n.dot-site {\n  width: 19px;\n  height: 19px;\n  bottom: 25px;\n  background: var(--accent);\n  box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--accent-soft);\n}\n.dot-flag {\n  position: absolute;\n  left: var(--x);\n  bottom: 54px;\n  transform: translateX(-50%);\n  white-space: nowrap;\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--accent);\n}\n.dot-flag::after { content: \"\"; position: absolute; left: 50%; top: 100%; width: 1px; height: 14px; background: var(--accent); }\n\n.legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 6px; }\n.legend span { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }\n.legend i { width: 12px; height: 12px; border-radius: 50%; display: block; flex: none; }\n.legend .i-mine { background: var(--accent-lift); }\n.legend .i-rival { background: var(--surface); border: 2px solid var(--mute); }\n.legend .i-site { background: var(--accent); }\n\n@media (max-width: 640px) {\n  .dot-scale { height: 150px; }\n  .bar-row { grid-template-columns: minmax(64px, auto) minmax(0, 1fr) auto; gap: 10px; }\n}\n\n/* -------------------------------------------------------------------------- */\n/* Demand map. A real control: the rings are distance, the pins are           */\n/* selectable, and picking one drives the panel underneath. Not a screenshot. */\n/* -------------------------------------------------------------------------- */\n\n.radar {\n  position: relative;\n  height: 340px;\n  background: var(--surface-2);\n  border-bottom: 1px solid var(--line);\n  overflow: hidden;\n}\n.radar-ring {\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  width: var(--d);\n  height: var(--d);\n  margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);\n  border: 1px solid var(--line-2);\n  border-radius: 50%;\n}\n.radar-home {\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  width: 13px;\n  height: 13px;\n  margin: -6.5px 0 0 -6.5px;\n  border-radius: 50%;\n  background: var(--accent);\n  box-shadow: 0 0 0 5px var(--accent-soft);\n}\n.radar-home-label {\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  margin: 14px 0 0 -34px;\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n}\n.radar-pin {\n  position: absolute;\n  transform: translate(-50%, -50%);\n  background: var(--surface);\n  border: 1px solid var(--line-2);\n  border-radius: var(--r-sm);\n  padding: 6px 12px;\n  font-size: 12.5px;\n  color: var(--ink);\n  cursor: pointer;\n  white-space: nowrap;\n  box-shadow: var(--shadow-1);\n  transition: border-color .18s ease, background .18s ease, color .18s ease;\n}\n.radar-pin:hover { border-color: var(--ink-3); }\n.radar-pin[aria-pressed=\"true\"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }\n\n@media (max-width: 560px) { .radar { height: 280px; } .radar-pin { font-size: 11.5px; padding: 5px 9px; } }\n\n/* -------------------------------------------------------------------------- */\n/* Engine rail. Six ordered stages named by what they do, on one shared        */\n/* spine, so it does not read as six identical cards.                          */\n/* -------------------------------------------------------------------------- */\n\n.engine { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }\n@media (min-width: 700px) { .engine { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n@media (min-width: 1000px) { .engine { grid-template-columns: repeat(3, minmax(0, 1fr)); } }\n.engine-step { background: var(--surface); padding: 24px 22px; display: grid; gap: 9px; align-content: start; }\n.engine-owner { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }\n\n/* -------------------------------------------------------------------------- */\n/* Bare figures. The margin section drops card chrome entirely and lets the\n   two figures sit on the section ground, split by one hairline. Without this\n   every section on the page is white rounded rectangles on a tinted band. */\n.figures { display: grid; gap: clamp(28px, 4vw, 56px); }\n@media (min-width: 900px) {\n  .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .figures > * + * { border-left: 1px solid var(--line-2); padding-left: clamp(28px, 4vw, 56px); }\n}\n@media (max-width: 899px) {\n  .figures > * + * { border-top: 1px solid var(--line-2); padding-top: clamp(28px, 4vw, 40px); }\n}\n\n/* Day timeline. Full width, three phases, no dead column.                    */\n/* -------------------------------------------------------------------------- */\n\n.day { display: grid; gap: 2px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }\n@media (min-width: 860px) { .day { grid-template-columns: repeat(3, minmax(0, 1fr)); } }\n.day-phase { background: var(--surface); padding: clamp(20px, 2.4vw, 30px); display: grid; gap: 18px; align-content: start; }\n.day-when { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }\n.day-event { display: grid; gap: 4px; padding-top: 16px; border-top: 1px solid var(--line); }\n.day-event:first-of-type { padding-top: 0; border-top: 0; }\n.day-at { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }\n\n/* -------------------------------------------------------------------------- */\n/* Approval demo. The product's core loop, running for real on the page.      */\n/* -------------------------------------------------------------------------- */\n\n.demo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-1); }\n.demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 22px; border-bottom: 1px solid var(--line); background: var(--surface-2); }\n.demo-body { padding: clamp(22px, 2.6vw, 32px); display: grid; gap: 18px; animation: k-rise .26s ease-out both; }\n.demo-figures { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }\n@media (min-width: 620px) { .demo-figures { grid-template-columns: repeat(3, minmax(0, 1fr)); } }\n.demo-fig { background: var(--surface); padding: 15px
